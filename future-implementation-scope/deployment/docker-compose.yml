version: "3.9"

services:

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://tinyfish:tinyfish@postgres:5432/tinyfish
      S3_BUCKET: tinyfish-scans
      AWS_ENDPOINT_URL: http://localstack:4566
    depends_on:
      - postgres
      - localstack

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: tinyfish
      POSTGRES_PASSWORD: tinyfish
      POSTGRES_DB: tinyfish
    ports:
      - "5432:5432"

  localstack:
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3